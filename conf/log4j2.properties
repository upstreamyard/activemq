# Modified by upstreamyard from the log4j2.properties in the Apache ActiveMQ release:
# everything goes to the console (no log files in the data folder). The audit logger keeps
# its own logger name, so you can still filter or raise it, e.g. logger.audit.level=OFF.

rootLogger.level=INFO
rootLogger.appenderRef.console.ref=Console

logger.spring.name=org.apache.activemq.spring
logger.spring.level=WARN
logger.web.name=org.apache.activemq.web.handler
logger.web.level=WARN
logger.springframework.name=org.springframework
logger.springframework.level=WARN
logger.xbean.name=org.apache.xbean
logger.xbean.level=WARN
logger.jetty.name=org.eclipse.jetty
logger.jetty.level=WARN
logger.jetty-spring.name=org.apache.activemq.spring.jetty
logger.jetty-spring.level=INFO
logger.jasper-digester.name=org.apache.tomcat.util.descriptor.DigesterFactory
logger.jasper-digester.level=ERROR

logger.audit.name=org.apache.activemq.audit
logger.audit.level=INFO

appender.console.type=Console
appender.console.name=Console
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{ISO8601} | %-5p | %m | %c | %t%n%throwable{full}
